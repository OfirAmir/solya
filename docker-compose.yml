services:
  solya:
    build: .
    image: solya
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/solya.db
    volumes:
      - ./data:/app/data
    ports:
      # loopback only, behind a reverse proxy: see README step 8 (Put HTTPS in front of port 8000)
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
