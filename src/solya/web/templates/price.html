{% extends "base.html" %}
{% block content %}
    <section class="card">
      <h1>המחיר החודשי</h1>
      <p class="note">מערכות במעקב: {{ names | join(", ") }}</p>
      <p class="total">{{ total }}</p>
      <form class="row" action="/pay" method="post">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit">אישור והמשך</button>
        <a href="/sites">שינוי הבחירה</a>
      </form>
      <p class="note">לא יבוצע חיוב בשלב הזה. ספק הסליקה טרם נבחר.</p>
    </section>
{% endblock %}
