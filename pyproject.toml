[project]
name = "solya"
version = "0.1.0"
description = "SolarEdge V2 monitoring service with a Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-telegram-bot~=22.8",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "pillow>=11",
    "astral>=3.2",
    "tzdata",
    "jinja2",
    "python-multipart",
    "itsdangerous",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[project.scripts]
solya = "solya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
